# ============================================================================
# Configuración SonarQube para SECE — proyecto ACS UMG Fase 2
# ============================================================================
# Usar con: sonar-scanner (requiere SonarQube corriendo en localhost:9000)
#
# Correr desde PowerShell:
#   .\scripts\sonar-scan.ps1
# ============================================================================

sonar.projectKey=sece-backend
sonar.projectName=SECE Backend
sonar.projectVersion=0.2.0

# Fuentes a analizar
sonar.sources=app
sonar.tests=app/tests
sonar.sourceEncoding=UTF-8

# Exclusiones
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/alembic/versions/**,\
  **/htmlcov/**,\
  **/docs/**

# Lenguaje y cobertura
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Quality gate (ver RNF-09)
# No se permiten issues Blocker ni Critical
